name: Bug report
description: retry-sentinel stopped when it should not have, or stayed silent when it should have spoken
labels: [bug]
body:
  - type: input
    id: pi-version
    attributes:
      label: pi version
      placeholder: "1.6.1"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: retry-sentinel output
      description: The [retry-sentinel] block from the TUI notification or stderr. Redact anything that looks like a key.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened vs what you expected
    validations:
      required: true
  - type: dropdown
    id: provider-state
    attributes:
      label: Was the provider actually down?
      options:
        - "Yes, confirmed down"
        - "No, other requests worked"
        - "Unknown"
    validations:
      required: true
