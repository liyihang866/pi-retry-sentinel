name: Bug report
description: retry-insight said something wrong, or said nothing when it should have
labels: [bug]
body:
  - type: input
    id: pi-version
    attributes:
      label: pi version
      placeholder: "1.6.1"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: retry-insight output
      description: The [retry-insight] block from TUI notify or stderr. Redact anything that looks like a key.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened vs what you expected
    validations:
      required: true
  - type: dropdown
    id: provider-state
    attributes:
      label: Was the provider actually down?
      options:
        - "Yes, confirmed down"
        - "No, other requests worked"
        - "Unknown"
    validations:
      required: true
